<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">MSME manufacturing infrastructure</title>
<desc id="desc">A modern small manufacturing business with machinery, inventory and digital infrastructure.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a35"/><stop offset="1" stop-color="#0b5c91"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#dbe8f2"/><stop offset="1" stop-color="#b7cad9"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8fb"/><stop offset=".5" stop-color="#8da5b8"/><stop offset="1" stop-color="#496579"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".28"/></filter>
</defs>
<rect width="1200" height="700" fill="url(#bg)"/>
<path d="M0 470 L1200 390 L1200 700 L0 700Z" fill="url(#floor)"/>
<g opacity=".18" stroke="#8ee8ff" stroke-width="2"><path d="M60 120H1140M60 180H1140M60 240H1140"/><path d="M160 70V420M340 70V420M520 70V420M700 70V420M880 70V420M1060 70V420"/></g>
<!-- factory roof -->
<path d="M90 155 L600 55 L1110 155 V420 H90Z" fill="#0d3150" opacity=".96"/>
<path d="M110 165 L600 72 L1090 165" fill="none" stroke="#5a9cba" stroke-width="5"/>
<!-- machines -->
<g filter="url(#shadow)">
 <g transform="translate(145 265)"><rect width="245" height="150" rx="10" fill="url(#metal)"/><rect x="22" y="22" width="201" height="70" rx="7" fill="#092640"/><circle cx="67" cy="57" r="19" fill="#42c6ed"/><circle cx="112" cy="57" r="19" fill="#75d85c"/><rect x="22" y="110" width="75" height="18" rx="4" fill="#21485f"/><rect x="112" y="110" width="111" height="18" rx="4" fill="#21485f"/></g>
 <g transform="translate(450 220)"><rect width="300" height="195" rx="12" fill="url(#metal)"/><rect x="28" y="24" width="244" height="92" rx="8" fill="#08243d"/><path d="M70 72h160" stroke="#3fd0ff" stroke-width="7"/><circle cx="70" cy="72" r="12" fill="#5ee36b"/><circle cx="230" cy="72" r="12" fill="#5ee36b"/><rect x="35" y="137" width="230" height="25" rx="5" fill="#234b61"/></g>
 <g transform="translate(820 285)"><rect width="220" height="130" rx="10" fill="url(#metal)"/><rect x="20" y="18" width="180" height="60" rx="7" fill="#092640"/><rect x="20" y="96" width="180" height="14" rx="4" fill="#21485f"/></g>
</g>
<!-- inventory -->
<g transform="translate(150 445)"><rect width="880" height="18" fill="#24465d"/><rect y="88" width="880" height="18" fill="#24465d"/><rect y="176" width="880" height="18" fill="#24465d"/>
 <g fill="#e9a63b" stroke="#9a6120" stroke-width="3"><rect x="30" y="20" width="120" height="50"/><rect x="175" y="20" width="120" height="50"/><rect x="320" y="20" width="120" height="50"/><rect x="465" y="20" width="120" height="50"/><rect x="610" y="20" width="120" height="50"/><rect x="755" y="20" width="90" height="50"/>
 <rect x="70" y="108" width="130" height="52"/><rect x="245" y="108" width="130" height="52"/><rect x="420" y="108" width="130" height="52"/><rect x="595" y="108" width="130" height="52"/><rect x="770" y="108" width="70" height="52"/></g></g>
<!-- people -->
<g transform="translate(970 150)"><circle cx="0" cy="0" r="30" fill="#f0b58a"/><path d="M-34 50Q0 18 34 50L48 155H-48Z" fill="#1685b3"/><path d="M-50 155L-18 155L-25 250H-58Z" fill="#263f55"/><path d="M50 155L18 155L25 250H58Z" fill="#263f55"/></g>
<!-- digital connection -->
<g fill="none" stroke="#66e4ff" stroke-width="4" opacity=".9"><path d="M605 125 C700 50 780 90 845 125"/><path d="M605 125 C520 65 420 100 365 155"/></g>
<g transform="translate(560 95)"><rect width="90" height="70" rx="16" fill="#ffffff" opacity=".96"/><path d="M24 45h43a18 18 0 0 0 0-36 25 25 0 0 0-46 7 15 15 0 0 0 3 29Z" fill="#2c9ed0"/><circle cx="30" cy="54" r="4" fill="#72cf5c"/><circle cx="45" cy="54" r="4" fill="#72cf5c"/><circle cx="60" cy="54" r="4" fill="#72cf5c"/></g>
</svg>
