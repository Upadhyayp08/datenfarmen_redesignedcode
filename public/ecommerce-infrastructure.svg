<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Ecommerce fulfillment infrastructure</title>
<desc id="desc">An ecommerce fulfillment warehouse with shelves, packages, scanning and connected cloud infrastructure.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a35"/><stop offset="1" stop-color="#075d91"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dfeaf2"/><stop offset="1" stop-color="#9eb6c8"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-opacity=".3"/></filter>
</defs>
<rect width="1200" height="700" fill="url(#bg)"/>
<path d="M0 445 L1200 360 V700 H0Z" fill="url(#floor)"/>
<!-- warehouse roof lights -->
<path d="M50 105L600 30L1150 105" fill="none" stroke="#76cbe8" stroke-width="7" opacity=".65"/>
<g fill="#fff" opacity=".9"><circle cx="260" cy="120" r="9"/><circle cx="600" cy="75" r="9"/><circle cx="940" cy="120" r="9"/></g>
<!-- shelves -->
<g filter="url(#shadow)">
 <g transform="translate(70 165)"><rect width="315" height="290" rx="10" fill="#173e58"/><g stroke="#f0a33b" stroke-width="12"><path d="M20 70H295M20 145H295M20 220H295"/><path d="M45 10V270M155 10V270M270 10V270"/></g><g fill="#f5c05d"><rect x="60" y="25" width="70" height="35"/><rect x="185" y="25" width="65" height="35"/><rect x="75" y="95" width="55" height="35"/><rect x="185" y="95" width="75" height="35"/><rect x="50" y="170" width="80" height="35"/><rect x="180" y="170" width="65" height="35"/><rect x="85" y="245" width="65" height="30"/><rect x="205" y="245" width="70" height="30"/></g></g>
 <g transform="translate(815 165)"><rect width="315" height="290" rx="10" fill="#173e58"/><g stroke="#f0a33b" stroke-width="12"><path d="M20 70H295M20 145H295M20 220H295"/><path d="M45 10V270M155 10V270M270 10V270"/></g><g fill="#f5c05d"><rect x="60" y="25" width="70" height="35"/><rect x="185" y="25" width="65" height="35"/><rect x="75" y="95" width="55" height="35"/><rect x="185" y="95" width="75" height="35"/><rect x="50" y="170" width="80" height="35"/><rect x="180" y="170" width="65" height="35"/><rect x="85" y="245" width="65" height="30"/><rect x="205" y="245" width="70" height="30"/></g></g>
</g>
<!-- packing station -->
<g transform="translate(420 380)" filter="url(#shadow)"><rect width="360" height="32" rx="8" fill="#25475c"/><rect x="35" y="32" width="24" height="175" fill="#25475c"/><rect x="300" y="32" width="24" height="175" fill="#25475c"/><rect x="75" y="-65" width="85" height="65" rx="8" fill="#d89035"/><rect x="200" y="-50" width="70" height="50" rx="7" fill="#e8a64c"/><path d="M165 -30h32" stroke="#fff" stroke-width="7"/></g>
<!-- worker -->
<g transform="translate(575 250)"><circle cx="0" cy="0" r="27" fill="#e8b185"/><path d="M-33 48Q0 18 33 48L45 145H-45Z" fill="#1b86b3"/><path d="M-45 145L-15 145L-25 235H-58Z" fill="#253e53"/><path d="M45 145L15 145L25 235H58Z" fill="#253e53"/><rect x="-70" y="65" width="55" height="32" rx="8" fill="#f1b348" transform="rotate(-18 -70 65)"/></g>
<!-- parcels -->
<g fill="#d99a45" stroke="#9b6424" stroke-width="3"><rect x="450" y="535" width="100" height="75"/><rect x="565" y="525" width="120" height="85"/><rect x="700" y="545" width="95" height="65"/></g>
<!-- digital cloud / orders -->
<g transform="translate(490 105)"><rect width="220" height="100" rx="22" fill="#ffffff" opacity=".96"/><path d="M53 67h113a26 26 0 0 0 0-52 35 35 0 0 0-65 9 22 22 0 0 0-48 15 28 28 0 0 0 0 28Z" fill="#2d9ed1"/><path d="M75 74h70" stroke="#73d05e" stroke-width="7" stroke-linecap="round"/><circle cx="90" cy="90" r="5" fill="#f0a33b"/><circle cx="110" cy="90" r="5" fill="#f0a33b"/><circle cx="130" cy="90" r="5" fill="#f0a33b"/></g>
<g fill="none" stroke="#6ce6ff" stroke-width="4"><path d="M600 205C560 255 520 275 480 315"/><path d="M600 205C700 250 760 285 830 350"/></g>
</svg>
